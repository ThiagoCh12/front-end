<!DOCTYPE html>
<html>
    <head>
        <title>GameHub - Ação</title>
    </head>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #1a1a2e;

        nav {
            font-size: 20px;
            background-color: #16213e;
            padding: 15px 20px;
        }

        nav ul {
            margin: 0;
            padding: 0;
            display: flex;
            gap: 100px;
        }

        nav a {
            color: white;

        }

        nav a:hover {

        }

        h1 {
            text-align: center;
            color: #e94560;
            margin: 40px 0 20px;
        }

        .espacojogos {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            padding: 20px;
        }

        .jogo {
            background-color: #16213e;
            border-radius: 8px;
            padding: 20px;
            width: 200px;
            text-align: center;
            border: 2px solid #e94560;
        }

        .jogo h3 {
            color: #e94560;
            margin: 0 0 10px;
        }

        .jogo a {
            color: #a8a8b3;
            text-decoration: none;
            font-size: 14px;
        }

        .jogo a:hover {
            color: white;
        }

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>

                <a href="https://www.callofduty.com">Ver na loja</a>
            </div>
            <div class="jogo">
                <h3>GTA V</h3>
                <p>Mundo aberto com ação total.</p>
                <a href="https://store.steampowered.com">Ver na loja</a>
            </div>
            <div class="jogo">
                <h3>God of War</h3>
