<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboTamagochi</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        h1 {
            color: #e94560;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        #status-texto {
            color: #a8a8b3;
            margin-bottom: 30px;
            font-size: 16px;
        }

        #pet {
            font-size: 10rem;
            margin: 20px;
            transition: transform 0.3s;
            cursor: default;
            user-select: none;
        }

        #pet:hover { transform: scale(1.05); }

        #barra-container {
            width: 300px;
            margin: 10px 0;
        }

        .barra-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 4px;
            color: #a8a8b3;
        }

        .barra {
            width: 100%;
            height: 16px;
            background: #30363d;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .barra-fill {
            height: 100%;
            border-radius: 8px;
            transition: width 0.5s ease;
        }

        #barra-fome-fill { background: #e94560; }
        #barra-humor-fill { background: #58a6ff; }
        #barra-energia-fill { background: #3fb950; }

        .botoes {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: #c73652; transform: scale(1.05); }
        button:active { transform: scale(0.97); }

        button.azul { background: #58a6ff; }
        button.azul:hover { background: #388bfd; }

        button.verde { background: #3fb950; }
        button.verde:hover { background: #2ea043; }

        button:disabled {
            background: #30363d;
            color: #a8a8b3;
            cursor: not-allowed;
            transform: none;
        }

        #msg {
            margin-top: 15px;
            font-size: 15px;
            color: #58a6ff;
            height: 20px;
        }

        #timer {
            margin-top: 8px;
            font-size: 13px;
            color: #a8a8b3;
        }
    </style>
</head>

<body>

    <h1>🤖 RoboTamagochi</h1>
    <div id="status-texto">Seu robô virtual está te esperando!</div>

    <div id="pet">🤖</div>

    <div id="barra-container">
        <div class="barra-label"><span>🍕 Fome</span><span id="val-fome">100%</span></div>
        <div class="barra"><div class="barra-fill" id="barra-fome-fill" style="width:100%"></div></div>

        <div class="barra-label"><span>😊 Humor</span><span id="val-humor">100%</span></div>
        <div class="barra"><div class="barra-fill" id="barra-humor-fill" style="width:100%"></div></div>

        <div class="barra-label"><span>⚡ Energia</span><span id="val-energia">100%</span></div>
        <div class="barra"><div class="barra-fill" id="barra-energia-fill" style="width:100%"></div></div>
    </div>

    <div class="botoes">
        <button onclick="alimentar()">🍕 Alimentar</button>
        <button class="azul" onclick="brincar()">🎮 Brincar</button>
        <button class="verde" onclick="dormir()">😴 Dormir</button>
    </div>

    <div id="msg"></div>
    <div id="timer"></div>

    <script>
        const estados = {
            feliz:    { emoji: "🤖", frase: "Estou ótimo! Pronto para codar!" },
            com_fome: { emoji: "😤", frase: "Preciso de energia! Me alimente!" },
            triste:   { emoji: "😢", frase: "Estou entediado... vamos brincar?" },
            cansado:  { emoji: "😴", frase: "Bateria fraca... preciso descansar." },
            comendo:  { emoji: "😋", frase: "Hmm, processando energia..." },
            brincando:{ emoji: "🎮", frase: "Yeahhh! Gameplay!" },
            morto:    { emoji: "💀", frase: "Bateria zerada. Game Over." }
        };

        let stats = { fome: 100, humor: 100, energia: 100 };
        let morto = false;
        let intervalo = null;

        function atualizar() {
            if (morto) return;

            stats.fome   = Math.max(0, stats.fome   - 3);
            stats.humor  = Math.max(0, stats.humor  - 2);
            stats.energia = Math.max(0, stats.energia - 1);

            atualizarUI();

            if (stats.fome === 0 && stats.humor === 0 && stats.energia === 0) {
                morrer();
            }
        }

        function atualizarUI() {
            document.getElementById("barra-fome-fill").style.width = stats.fome + "%";
            document.getElementById("barra-humor-fill").style.width = stats.humor + "%";
            document.getElementById("barra-energia-fill").style.width = stats.energia + "%";

            document.getElementById("val-fome").textContent = stats.fome + "%";
            document.getElementById("val-humor").textContent = stats.humor + "%";
            document.getElementById("val-energia").textContent = stats.energia + "%";

            if (!morto) {
                const pet = document.getElementById("pet");
                const status = document.getElementById("status-texto");

                if (stats.fome <= 20) {
                    pet.textContent = estados.com_fome.emoji;
                    status.textContent = estados.com_fome.frase;
                } else if (stats.humor <= 20) {
                    pet.textContent = estados.triste.emoji;
                    status.textContent = estados.triste.frase;
                } else if (stats.energia <= 20) {
                    pet.textContent = estados.cansado.emoji;
                    status.textContent = estados.cansado.frase;
                } else {
                    pet.textContent = estados.feliz.emoji;
                    status.textContent = estados.feliz.frase;
                }
            }
        }

        function mostrarMsg(texto) {
            document.getElementById("msg").textContent = texto;
            setTimeout(() => document.getElementById("msg").textContent = "", 2000);
        }

        function animarPet(emoji, duracao) {
            const pet = document.getElementById("pet");
            const original = pet.textContent;
            pet.textContent = emoji;
            setTimeout(() => {
                if (!morto) pet.textContent = estados.feliz.emoji;
            }, duracao);
        }

        function alimentar() {
            if (morto) return;
            stats.fome = Math.min(100, stats.fome + 40);
            animarPet(estados.comendo.emoji, 1500);
            mostrarMsg("Yummy! +40 energia alimentar!");
            atualizarUI();
        }

        function brincar() {
            if (morto) return;
            if (stats.energia < 15) {
                mostrarMsg("Sem energia para brincar! Me deixe dormir.");
                return;
            }
            stats.humor  = Math.min(100, stats.humor  + 35);
            stats.energia = Math.max(0, stats.energia - 15);
            animarPet(estados.brincando.emoji, 1500);
            mostrarMsg("Wheee! +35 humor!");
            atualizarUI();
        }

        function dormir() {
            if (morto) return;
            stats.energia = Math.min(100, stats.energia + 50);
            animarPet(estados.cansado.emoji, 2000);
            mostrarMsg("Zzz... +50 energia!");
            atualizarUI();
        }

        function morrer() {
            morto = true;
            clearInterval(intervalo);
            document.getElementById("pet").textContent = estados.morto.emoji;
            document.getElementById("status-texto").textContent = estados.morto.frase;
            document.getElementById("msg").textContent = "Pressione F5 para reiniciar.";
            document.querySelectorAll("button").forEach(b => b.disabled = true);
        }

        intervalo = setInterval(atualizar, 2000);
        atualizarUI();
    </script>

</body>
</html>
