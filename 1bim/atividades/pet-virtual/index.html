<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboTamagochi</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🤖 RoboTamagochi</h1>
    <div id="status-texto">Seu robô virtual está te esperando!</div>

    <div id="pet">🤖</div>

    <div id="barra-container">
        <div class="barra-label"><span>🍕 Fome</span><span id="val-fome">100%</span></div>
        <div class="barra"><div class="barra-fill" id="barra-fome-fill" style="width:100%"></div></div>

        <div class="barra-label"><span>😊 Humor</span><span id="val-humor">100%</span></div>
        <div class="barra"><div class="barra-fill" id="barra-humor-fill" style="width:100%"></div></div>

        <div class="barra-label"><span>⚡ Energia</span><span id="val-energia">100%</span></div>
        <div class="barra"><div class="barra-fill" id="barra-energia-fill" style="width:100%"></div></div>
    </div>

    <div class="botoes">
        <button onclick="alimentar()">🍕 Alimentar</button>
        <button class="azul" onclick="brincar()">🎮 Brincar</button>
        <button class="verde" onclick="dormir()">😴 Dormir</button>
    </div>

    <div id="msg"></div>
    <div id="timer"></div>

    <script src="script.js"></script>

</body>
</html>
