<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="../style/style.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <title>Estetica FLow</title>
    </head>
    <body>
        <header>
            <h1>Estetica Flow</h1>
        </header>
        <main>
            <form id="form-login" class="form-login">
                <label for="email">Email</label>
                <input id="input-email" class="input-form-login" name="email" type="email">
                <label for="password">Password</label>
                <input id="input-password" class="input-form-login" name="password" type="password">
                <button id="button-submit-login" class="button-submit-login" type="submit">Submit</button> 
                <a id="link-forgot-password" class="link" href="#">Esqueci a senha</a>
                <p id="message"></p>
            </form>
        </main>
        <footer>
            <p>Desenvolvido por Thiago C Chagas. Todos os direitos reservados.</p>
            <a id="link-github" class="link" href="https://github.com/ThiagoCh12">Github</a>
        </footer>

        <script src="../js/script.js"></script>
    </body>
</html>
