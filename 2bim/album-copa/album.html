<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum da Copa 2026 - Grupos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Questão 2: Cabeçalho centralizado -->
    <header class="cabecalho">
        <img src="img/FIFA-World-Cup-26.jpg" alt="FIFA World Cup 26" class="logo-copa">
        <h1>Álbum da Copa do Mundo 2026</h1>
        <p>Conheça os grupos da competição</p>
    </header>

    <!-- Questão 1 e 3: os grupos são renderizados aqui pelo script.js -->
    <main id="lista-grupos" class="container-album">
        <!-- preenchido dinamicamente -->
    </main>

    <!-- Questão 3: botão Próximo alterna os grupos exibidos (A/B/C <-> D/E/F) -->
    <div class="area-botao">
        <button id="btn-proximo" class="btn" onclick="proximo()">Próximo</button>
    </div>

    <script src="script.js"></script>
    <script>
        // Renderiza a primeira página de grupos assim que a página carrega
        renderizarGrupos();
    </script>
</body>
</html>
