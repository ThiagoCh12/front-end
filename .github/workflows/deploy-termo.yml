name: Deploy termo-react

on:
  push:
    branches: [master]
    paths:
      - '2bim/termo-react/**'
      - '.github/workflows/deploy-termo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2bim/termo-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 2bim/termo-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish build to /termo on master
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master
          publish_dir: 2bim/termo-react/dist
          destination_dir: termo
          keep_files: true
          commit_message: 'deploy: termo-react [skip ci]'
