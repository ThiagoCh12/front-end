name: Deploy termo-react

on:
  push:
    branches: [master]
    paths:
      - '2bim/termo-react/**'
      - '.github/workflows/deploy-termo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2bim/termo-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 2bim/termo-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish build to /termo on master
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf termo
          mkdir -p termo
          cp -r 2bim/termo-react/dist/. termo/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add termo
          if git diff --staged --quiet; then
            echo "Nada para publicar."
          else
            git commit -m "deploy: termo-react [skip ci]"
            git push
          fi
